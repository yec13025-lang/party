<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接无效</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #fff5f8 0%, #ffe9f0 100%);
            color: #3f3f46;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 36px 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 40px rgba(246, 142, 182, .22);
        }
        h1 { font-size: 22px; margin: 0 0 12px; color: #ec5f92; }
        p { line-height: 1.7; margin: 0 0 10px; color: #6b7280; font-size: 15px; }
        a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 28px;
            border-radius: 999px;
            background: linear-gradient(90deg, #f68eb6, #f6a5c0);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
<div class="card">
    <h1>链接无效或已过期</h1>
    <p>访问这个页面需要一个有效的 token。</p>
    <p>请使用完整的分享链接重新打开。</p>
    <a href="/">返回制作页面</a>
</div>
</body>

</html>
